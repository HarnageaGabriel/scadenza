name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and vet
        shell: bash
        run: go build ./... && go vet ./...
      # The race detector needs cgo and a C toolchain, which this job does not
      # set up for Windows, so Windows runs the same tests without -race.
      - name: Test with race detector
        if: runner.os != 'Windows'
        shell: bash
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        shell: bash
        run: go test ./...
      - name: Coverage floors
        if: runner.os == 'Linux'
        run: make cover-floors

  lint:
    name: Lint and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Generated diagnostics
        run: make docs-check

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck version
        run: shellcheck --version
      - name: ShellCheck
        run: shellcheck --severity=warning scripts/*.sh

  schema-compat:
    name: Schema compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the schema checker
        run: go build -o "$RUNNER_TEMP/schemadiff" ./tools/schemadiff
      - name: Find the released schema baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          # A prerelease tag such as v0.0.0-rc.1 is a rehearsal, not a baseline.
          tag="$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$tag" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No released baseline yet: no vMAJOR.MINOR.PATCH tag exists."
            exit 0
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Baseline schema tag: $tag"
      - name: Compare the published schemas with the baseline
        if: steps.baseline.outputs.released == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.baseline.outputs.tag }}"
          status=0
          for schema in docs/schema/ct-v1.schema.json docs/schema/scan-v1.schema.json; do
            if ! git cat-file -e "$tag:$schema" 2>/dev/null; then
              echo "$schema is not in $tag; there is nothing to compare."
              continue
            fi
            old="$RUNNER_TEMP/$(basename "$schema")"
            git show "$tag:$schema" > "$old"
            echo "Comparing $schema against $tag"
            if ! "$RUNNER_TEMP/schemadiff" "$old" "$schema"; then
              status=1
            fi
          done
          exit "$status"

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  goreleaser:
    name: GoReleaser configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with: {distribution: goreleaser, version: '~> v2', args: check}
