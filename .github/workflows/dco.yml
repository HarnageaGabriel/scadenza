name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Require matching Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          offenders=()
          while read -r commit parent_line; do
            if [[ "$parent_line" == *' '* ]]; then
              continue
            fi

            author_name=$(git show -s --format='%aN' "$commit")
            author_email=$(git show -s --format='%aE' "$commit")
            author="$author_name <$author_email>"
            email_login="${author_email%%@*}"
            bot_login="${email_login##*+}"

            if [[ "$author_name" == *'[bot]' || "$bot_login" == *'[bot]' ]]; then
              continue
            fi

            body=$(git show -s --format='%B' "$commit" | tr -d '\r')
            if ! grep -Fqx -- "Signed-off-by: $author" <<<"$body"; then
              offenders+=("$commit ($author)")
            fi
          done < <(git rev-list --parents "$BASE..$HEAD")

          if (( ${#offenders[@]} > 0 )); then
            echo "DCO check failed for these human commits:"
            printf '  %s\n' "${offenders[@]}"
            echo "Fix them with: git rebase --signoff"
            exit 1
          fi
