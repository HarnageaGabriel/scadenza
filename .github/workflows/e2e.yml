name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "43 3 * * 2"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # VERIFY: pinned from https://cert-manager.io/docs/installation/kubectl/ , which
  # documents `kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml`
  # as the install path. Bump deliberately and re-check the URL plus the release
  # notes before changing it.
  CERT_MANAGER_VERSION: v1.21.2
  # VERIFY: pinned from https://kind.sigs.k8s.io/docs/user/quick-start/ . Re-check
  # the version and the download URL before changing it.
  KIND_VERSION: v0.30.0
  KIND_CLUSTER: scadenza-e2e
  E2E_NAMESPACE: scadenza-e2e

jobs:
  kind:
    name: kind + cert-manager
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 ./kind /usr/local/bin/kind
          kind version
      - name: Create the cluster
        run: kind create cluster --name "${KIND_CLUSTER}" --wait 180s
      - name: Install cert-manager
        run: |
          kubectl apply -f "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
          kubectl -n cert-manager wait --for=condition=Established --timeout=180s crd/certificates.cert-manager.io
          kubectl -n cert-manager wait --for=condition=Available deployment --all --timeout=300s
      - name: Create the self-signed issuer and certificates
        run: |
          kubectl apply -f - <<'YAML'
          apiVersion: v1
          kind: Namespace
          metadata:
            name: scadenza-e2e
            labels:
              scadenza.io/owner: team-e2e
          ---
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: scadenza-selfsigned
          spec:
            selfSigned: {}
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: short
            namespace: scadenza-e2e
            labels:
              scadenza.io/owner: team-e2e
          spec:
            secretName: short-tls
            duration: 720h
            renewBefore: 168h
            commonName: short.e2e.example.com
            dnsNames:
              - short.e2e.example.com
            issuerRef:
              name: scadenza-selfsigned
              kind: ClusterIssuer
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: long
            namespace: scadenza-e2e
            labels:
              scadenza.io/owner: team-e2e
          spec:
            secretName: long-tls
            duration: 2160h
            renewBefore: 720h
            commonName: long.e2e.example.com
            dnsNames:
              - long.e2e.example.com
            issuerRef:
              name: scadenza-selfsigned
              kind: ClusterIssuer
          YAML
          kubectl -n "${E2E_NAMESPACE}" wait --for=condition=Ready --timeout=180s certificate/short certificate/long
      - name: Configure and verify read-only service account
        id: readonly
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f deploy/rbac/scadenza-readonly.yaml
          service_account=system:serviceaccount:scadenza:scadenza-readonly
          for resource in secrets certificates.cert-manager.io; do
            for verb in create update patch delete watch; do
              if [[ "$(kubectl auth can-i "${verb}" "${resource}" --as="${service_account}" --all-namespaces)" != "no" ]]; then
                echo "unexpected permission: ${verb} ${resource}" >&2
                exit 1
              fi
            done
          done
          if [[ "$(kubectl auth can-i list secrets --as="${service_account}" --all-namespaces)" != "no" ]]; then
            echo "default service account unexpectedly lists Secrets" >&2
            exit 1
          fi
          kubeconfig="${RUNNER_TEMP}/scadenza-readonly.kubeconfig"
          ca_file="${RUNNER_TEMP}/scadenza-readonly-ca.crt"
          kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 --decode > "${ca_file}"
          server="$(kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.server}')"
          token="$(kubectl -n scadenza create token scadenza-readonly --duration=30m)"
          kubectl config --kubeconfig="${kubeconfig}" set-cluster scadenza-e2e --server="${server}" --certificate-authority="${ca_file}" --embed-certs=true
          kubectl config --kubeconfig="${kubeconfig}" set-credentials scadenza-readonly --token="${token}"
          kubectl config --kubeconfig="${kubeconfig}" set-context scadenza-readonly --cluster=scadenza-e2e --user=scadenza-readonly
          echo "kubeconfig=${kubeconfig}" >> "${GITHUB_OUTPUT}"
          echo "context=scadenza-readonly" >> "${GITHUB_OUTPUT}"
          kubectl apply -f deploy/rbac/scadenza-readonly-secrets.yaml
          secrets_service_account=system:serviceaccount:scadenza:scadenza-readonly-secrets
          for verb in list get; do
            if [[ "$(kubectl auth can-i "${verb}" secrets --as="${secrets_service_account}" --all-namespaces)" != "yes" ]]; then
              echo "Secrets service account cannot ${verb} Secrets" >&2
              exit 1
            fi
          done
          secrets_kubeconfig="${RUNNER_TEMP}/scadenza-readonly-secrets.kubeconfig"
          secrets_ca_file="${RUNNER_TEMP}/scadenza-readonly-secrets-ca.crt"
          kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 --decode > "${secrets_ca_file}"
          secrets_server="$(kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.server}')"
          secrets_token="$(kubectl -n scadenza create token scadenza-readonly-secrets --duration=30m)"
          kubectl config --kubeconfig="${secrets_kubeconfig}" set-cluster scadenza-e2e --server="${secrets_server}" --certificate-authority="${secrets_ca_file}" --embed-certs=true
          kubectl config --kubeconfig="${secrets_kubeconfig}" set-credentials scadenza-readonly-secrets --token="${secrets_token}"
          kubectl config --kubeconfig="${secrets_kubeconfig}" set-context scadenza-readonly-secrets --cluster=scadenza-e2e --user=scadenza-readonly-secrets
          echo "secrets_kubeconfig=${secrets_kubeconfig}" >> "${GITHUB_OUTPUT}"
          echo "secrets_context=scadenza-readonly-secrets" >> "${GITHUB_OUTPUT}"
      - name: Run the Kubernetes source e2e
        env:
          KUBECONFIG: ${{ steps.readonly.outputs.kubeconfig }}
          SCADENZA_E2E_KUBE_CONTEXT: ${{ steps.readonly.outputs.context }}
          SCADENZA_E2E_SECRETS_KUBECONFIG: ${{ steps.readonly.outputs.secrets_kubeconfig }}
          SCADENZA_E2E_SECRETS_KUBE_CONTEXT: ${{ steps.readonly.outputs.secrets_context }}
          SCADENZA_E2E_NAMESPACE: ${{ env.E2E_NAMESPACE }}
        run: go test -tags e2e -count=1 -v ./test/e2e/...
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get certificates,secrets -A
          kubectl -n cert-manager get pods
