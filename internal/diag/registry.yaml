schemaVersion: 1
codes:
  - code: SCD-0001
    slug: invalid-domain-argument
    severity: error
    summary: Domain argument is invalid
    explanation: The supplied value is not a valid domain name for a public certificate lookup.
    remediation: Supply a DNS domain name without a scheme, port, path, or wildcard.
  - code: SCD-0002
    slug: ct-source-unavailable
    severity: error
    summary: Certificate Transparency source is unavailable
    explanation: The configured Certificate Transparency source could not be reached or did not provide a usable response.
    remediation: Retry later or select another configured Certificate Transparency source.
  - code: SCD-0003
    slug: ct-source-rate-limited
    severity: error
    summary: Certificate Transparency source rate limit reached
    explanation: The Certificate Transparency source refused the request because its request limit was reached.
    remediation: Wait before retrying or configure another Certificate Transparency source.
  - code: SCD-0004
    slug: ct-response-malformed
    severity: error
    summary: Certificate Transparency response is malformed
    explanation: The Certificate Transparency source returned data that scadenza could not decode safely.
    remediation: Retry the request and report the source response format if the problem persists.
  - code: SCD-0005
    slug: ct-no-results
    severity: info
    summary: No Certificate Transparency results found
    explanation: The Certificate Transparency source returned no certificate records for the requested domain.
    remediation: Check the domain spelling or query another Certificate Transparency source.
  - code: SCD-0006
    slug: ct-results-truncated
    severity: warning
    summary: Certificate Transparency results were truncated
    explanation: More matching certificate records were available than the configured result limit permits.
    remediation: Increase --max-results when a complete result set is required.
  - code: SCD-0007
    slug: ct-source-fell-back
    severity: warning
    summary: Certificate Transparency source fallback used
    explanation: A preferred Certificate Transparency source failed, so scadenza queried the next selected source.
    remediation: Review the preceding source diagnostic or retry the preferred source later.
  - code: SCD-0008
    slug: wildcard-name-not-probed
    severity: warning
    summary: Wildcard certificate name was not probed
    explanation: A wildcard subject name was derived from Certificate Transparency. A wildcard covers no single host, so scadenza listed it as unresolved instead of guessing a host name.
    remediation: Name a concrete host with --host to check the wildcard certificate.
  - code: SCD-0009
    slug: probe-host-cap-reached
    severity: warning
    summary: Probe host limit reached
    explanation: More probe hosts were collected than --max-hosts permits, so the remaining hosts were listed as unresolved and were never probed.
    remediation: Increase --max-hosts to probe every host.
  - code: SCD-0010
    slug: tls-probe-failed
    severity: warning
    summary: TLS probe failed
    explanation: A TLS handshake could not be completed. The detail names the host and the failure class, one of dns, connect-timeout, refused, canceled, tls-alert, no-certificate, or handshake-failed.
    remediation: Check the host name, network reachability, and whether the endpoint serves TLS on the probed port.
  - code: SCD-0011
    slug: certificate-not-trusted
    severity: warning
    summary: Presented certificate is not trusted
    explanation: A probed host presented a certificate chain that does not verify against the system roots for the requested name. The certificate is reported but never trusted.
    remediation: Confirm the endpoint certificate, chain, and name, or treat the certificate as private or untrusted.
  - code: SCD-0012
    slug: ct-only-finding
    severity: warning
    summary: Certificate Transparency certificate was not observed live
    explanation: A certificate that is still valid in Certificate Transparency was not presented by any probed host.
    remediation: Check whether the certificate is deployed, retired, or replaced by another certificate.
  - code: SCD-0013
    slug: live-only-finding
    severity: warning
    summary: Live certificate absent from Certificate Transparency
    explanation: A probed host presented a certificate that the Certificate Transparency results for the scanned domains did not contain.
    remediation: Confirm the certificate is publicly logged, or treat it as private or untrusted.
  - code: SCD-0014
    slug: kube-unreachable
    severity: error
    summary: Kubernetes source is unavailable
    explanation: Kubernetes rejected authentication, the API server could not be reached, or no requested Secret or Certificate list operation succeeded.
    remediation: Check the kubeconfig, credentials, --kube-context, cluster connectivity, and read-only RBAC, then retry.
  - code: SCD-0015
    slug: kube-forbidden
    severity: warning
    summary: Kubernetes read access was forbidden
    explanation: Kubernetes RBAC refused a read. Structured fields name the resource kind, namespace, HTTP status, and StatusReason. This is a partial failure when another requested resource kind was read successfully.
    remediation: Grant the documented read-only ClusterRole with list/get on secrets, certificates, issuers, clusterissuers, and namespaces.
  - code: SCD-0016
    slug: secret-without-certificate
    severity: warning
    summary: TLS secret holds no certificate
    explanation: A secret of type kubernetes.io/tls was read but contained no tls.crt data, so no certificate could be parsed from it. The private key is never read.
    remediation: Confirm the secret is a complete kubernetes.io/tls secret, or remove it when it is stale.
  - code: SCD-0017
    slug: certificate-parse-failed
    severity: warning
    summary: Kubernetes certificate could not be parsed
    explanation: The tls.crt payload could not be parsed as a PEM certificate chain. The detail names the secret; no certificate or key data is logged.
    remediation: Replace the secret data with a valid PEM certificate chain.
  - code: SCD-0018
    slug: cert-manager-crd-missing
    severity: info
    summary: cert-manager custom resources are not installed
    explanation: The cert-manager.io/v1 custom resource definitions could not be listed, so cert-manager Certificates were skipped. TLS Secrets were still read.
    remediation: Install cert-manager to include Certificate, Issuer, and ClusterIssuer observations, or accept TLS Secrets only.
  - code: SCD-0019
    slug: ownership-file-invalid
    severity: error
    summary: Ownership file could not be used
    explanation: The --ownership-file could not be read or did not match the documented schema. Owner resolution is not attempted from an invalid file, so no owner is inferred.
    remediation: Fix the YAML so it contains only labelKeys, domains, and namespaces, and give every value a non-empty string.
  - code: SCD-0020
    slug: incomplete-scan
    severity: error
    summary: Scan did not check everything it was asked to check
    explanation: Either --strict found a partial or failed source, a failed probe, or an unchecked name, or the coverage ratio fell below --min-coverage. The results are still complete for what was checked; the scan is simply not a clean one.
    remediation: Review the coverage summary and unresolved names, then raise --max-hosts, fix the failing source or probe, or lower --min-coverage once the gap is understood.
  - code: SCD-0021
    slug: invalid-fail-on-kind
    severity: error
    summary: Invalid --fail-on kind
    explanation: The --fail-on value listed a kind that is not one of ct_only, live_only, exceeds-100d, not-compliant-at-issuance, renew-before-exceeds-lifetime, renewal-degraded, renew-before-loop-at-next-limit, duration-exceeds-next-limit, manual-renewal-after-limit, or none, or combined none with another kind.
    remediation: Use only the documented kinds; pass none alone to disable exit 3.
  - code: SCD-0022
    slug: config-invalid
    severity: error
    summary: Configuration file could not be used
    explanation: The --config file could not be read, did not decode as strict YAML version 1, or set a value outside its documented range. Nothing is auto-loaded, so only an explicit --config is read.
    remediation: Fix the file to match docs/configuration.md; only known keys with valid values are accepted.
  - code: SCD-0023
    slug: renew-before-exceeds-lifetime
    severity: warning
    summary: Fixed renewBefore is not shorter than the issued lifetime
    explanation: A cert-manager Certificate sets spec.renewBefore to a value at or beyond the actual issued lifetime (status.notBefore to status.notAfter, or the Secret leaf), so cert-manager renews in a loop. cert-manager requires spec.duration to be greater than spec.renewBefore.
    remediation: Set spec.renewBeforePercentage instead of a fixed spec.renewBefore, so renewal follows the actual issued duration.
  - code: SCD-0024
    slug: renew-before-loop-at-next-limit
    severity: warning
    summary: Fixed renewBefore reaches the next shorter lifetime
    explanation: A fixed spec.renewBefore is at or beyond the next CA/B maximum validity, or the next announced Let's Encrypt lifetime for an ACME issuer on acme-v02.api.letsencrypt.org. Renewal will loop once the shorter lifetime takes effect; the risk records the effective date.
    remediation: Set spec.renewBeforePercentage so the renewal point follows the actual issued duration.
  - code: SCD-0025
    slug: duration-exceeds-next-limit
    severity: warning
    summary: Requested duration exceeds the next public-CA lifetime
    explanation: A cert-manager Certificate with an ACME issuer on a known public CA directory requests a spec.duration longer than the next CA/B maximum validity. The public CA will issue a shorter lifetime than requested. An unknown ACME server produces no finding, only evidence.
    remediation: Set spec.duration no longer than the next CA/B maximum validity, or confirm the issuer is a private CA.
  - code: SCD-0026
    slug: renewal-degraded
    severity: warning
    summary: Renewal health is degraded
    explanation: A cert-manager Certificate reports Ready=False, status.renewalTime passed more than one hour before the evaluation instant, or status.notAfter has passed. The certificate is not being renewed as expected.
    remediation: Inspect the Certificate conditions and issuer, and confirm the certificate is renewed before status.notAfter.
  - code: SCD-0027
    slug: manual-renewal-after-limit
    severity: warning
    summary: Manual renewal falls after the next CA/B step
    explanation: An operator declared a domain as manually renewed in scadenza.yaml, and the certificate's notAfter falls after the next CA/B maximum validity step, so the manual renewal workload grows.
    remediation: Move the certificate to an automatic renewal mechanism, or plan the additional manual renewals per year.