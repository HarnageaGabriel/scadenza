schemaVersion: 1
codes:
  - code: SCD-0001
    slug: invalid-domain-argument
    severity: error
    summary: Domain argument is invalid
    explanation: The supplied value is not a valid domain name for a public certificate lookup.
    remediation: Supply a DNS domain name without a scheme, port, path, or wildcard.
  - code: SCD-0002
    slug: ct-source-unavailable
    severity: error
    summary: Certificate Transparency source is unavailable
    explanation: The configured Certificate Transparency source could not be reached or did not provide a usable response.
    remediation: Retry later or select another configured Certificate Transparency source.
  - code: SCD-0003
    slug: ct-source-rate-limited
    severity: error
    summary: Certificate Transparency source rate limit reached
    explanation: The Certificate Transparency source refused the request because its request limit was reached.
    remediation: Wait before retrying or configure another Certificate Transparency source.
  - code: SCD-0004
    slug: ct-response-malformed
    severity: error
    summary: Certificate Transparency response is malformed
    explanation: The Certificate Transparency source returned data that scadenza could not decode safely.
    remediation: Retry the request and report the source response format if the problem persists.
  - code: SCD-0005
    slug: ct-no-results
    severity: info
    summary: No Certificate Transparency results found
    explanation: The Certificate Transparency source returned no certificate records for the requested domain.
    remediation: Check the domain spelling or query another Certificate Transparency source.
  - code: SCD-0006
    slug: ct-results-truncated
    severity: warning
    summary: Certificate Transparency results were truncated
    explanation: More matching certificate records were available than the configured result limit permits.
    remediation: Increase --max-results when a complete result set is required.
  - code: SCD-0007
    slug: ct-source-fell-back
    severity: warning
    summary: Certificate Transparency source fallback used
    explanation: A preferred Certificate Transparency source failed, so scadenza queried the next selected source.
    remediation: Review the preceding source diagnostic or retry the preferred source later.
