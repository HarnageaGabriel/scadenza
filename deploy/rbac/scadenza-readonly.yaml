# Minimal read-only RBAC for `scadenza scan --kube`.
#
# scadenza only ever issues list and get. It never watches and never writes, so
# this ClusterRole grants exactly those verbs and nothing else.
#
# This is the default `scan --kube` grant: Secret data and even Secret metadata
# are forbidden. When the metadata list returns 403, scadenza records warning
# SCD-0015 and continues with cert-manager and namespace observations.
#
# VERIFY (2026-10-15): confirmed against
# https://kubernetes.io/docs/reference/access-authn-authz/authorization/#reviewing-request-fields
# and the RBAC documentation's description of `list`: RBAC authorizes the
# request verb, resource, subresource, namespace, and API group, not the
# response representation, Accept header, or field selector. It therefore
# cannot distinguish a metadata-only list from a full-object list. Keep
# `secrets` absent here unless Secret data access is explicitly intended.
apiVersion: v1
kind: Namespace
metadata:
  name: scadenza
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scadenza-readonly
  namespace: scadenza
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scadenza-readonly
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "get"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers", "clusterissuers"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scadenza-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scadenza-readonly
subjects:
  - kind: ServiceAccount
    name: scadenza-readonly
    namespace: scadenza
