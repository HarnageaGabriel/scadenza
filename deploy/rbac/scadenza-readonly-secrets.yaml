# Opt-in RBAC for `scadenza scan --kube --kube-secrets`.
#
# This manifest is deliberately separate from scadenza-readonly.yaml. Applying
# it grants Secret list/get in addition to namespaces and cert-manager reads.
# Scadenza still uses only list/get, drops tls.key immediately, and never writes.
#
# VERIFY (2026-10-15): confirmed against
# https://kubernetes.io/docs/reference/access-authn-authz/authorization/#reviewing-request-fields
# and the RBAC documentation's description of `list`. RBAC authorizes the verb,
# resource, subresource, namespace, and API group, not the response
# representation, Accept header, or field selector. Consequently RBAC cannot
# distinguish a PartialObjectMetadata list from a full Secret list; granting
# `secrets` is equivalent authorization for both representations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scadenza-readonly-secrets
  namespace: scadenza
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scadenza-readonly-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "get"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers", "clusterissuers"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scadenza-readonly-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scadenza-readonly-secrets
subjects:
  - kind: ServiceAccount
    name: scadenza-readonly-secrets
    namespace: scadenza

# Narrower per-namespace alternative: repeat the Role and RoleBinding for each
# selected namespace, bind scadenza-readonly-secrets, and omit namespaces and
# clusterissuers. Cluster-scoped reads then require a separate scan scope.
