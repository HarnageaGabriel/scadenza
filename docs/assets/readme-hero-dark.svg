<text x="28" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9aa7b4">A manual renewal that happens once a year today becomes a job you do every quarter, then every six weeks.</text>
