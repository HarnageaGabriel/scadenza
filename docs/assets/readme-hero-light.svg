<text x="634" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#14b4c8">≈ 8</text>
<text x="680" y="255" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5b6b7b">DCV reuse: 10 days</text>
<text x="28" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#5b6b7b">A manual renewal that happens once a year today becomes a job you do every quarter, then every six weeks.</text>
