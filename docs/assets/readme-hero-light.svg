<text x="852" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#5b6b7b" text-anchor="end">CA/Browser Forum ballot SC-081v3</text>
<text x="634" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5b6b7b">renewals per year</text>
<text x="28" y="111" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#1b3a5c">until 2026-03-14</text>
