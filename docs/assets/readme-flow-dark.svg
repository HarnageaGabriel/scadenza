<text x="38" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">TLS handshake (SNI)</text>
<text x="38" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa7b4">what is served</text>
<path d="M254,115 C300,115 300,150 336,150" fill="none" stroke="#9aa7b4" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="152" width="230" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="38" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Kubernetes + cert-manager</text>
<text x="38" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa7b4">what is managed</text>
