<text x="778" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle">Report</text>
<text x="778" y="141" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">table · JSON · CSV</text>
<text x="778" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">owner, location</text>
<text x="778" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">ct_only · live_only</text>
<text x="778" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9aa7b4" text-anchor="middle">exit code for CI</text>
<text x="24" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa7b4">Dashed: planned. Read-only everywhere: list and get, never write.</text>
</svg>