<rect x="24" y="214" width="230" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="5 4"/>
<text x="38" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#9aa7b4">Azure Key Vault</text>
<text x="38" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa7b4">planned</text>
<path d="M254,239 C300,239 300,150 336,150" fill="none" stroke="#9aa7b4" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="340" y="112" width="150" height="76" rx="10" fill="#161b22" stroke="#9fb6cf" stroke-width="2"/>
<text x="415" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#9fb6cf" text-anchor="middle">Correlate</text>
<text x="415" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa7b4" text-anchor="middle">one certificate, every</text>
<text x="415" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa7b4" text-anchor="middle">place it appears</text>
<rect x="520" y="112" width="150" height="76" rx="10" fill="#161b22" stroke="#2bb3c4" stroke-width="2" stroke-dasharray="5 4"/>
<text x="595" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#2bb3c4" text-anchor="middle">Classify renewal</text>
<text x="595" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa7b4" text-anchor="middle">automatic · manual</text>
<text x="595" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#9aa7b4" text-anchor="middle">· unknown</text>
<path d="M490,150 L516,150" stroke="#9aa7b4" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M670,150 L696,150" stroke="#9aa7b4" stroke-width="1.5" marker-end="url(#a)"/>
