version: 2

builds:
  - id: scadenza
    main: ./cmd/scadenza
    binary: scadenza
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/HarnageaGabriel/scadenza/internal/version.Version={{.Version}}
      - -X github.com/HarnageaGabriel/scadenza/internal/version.Commit={{.Commit}}
      - -X github.com/HarnageaGabriel/scadenza/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

