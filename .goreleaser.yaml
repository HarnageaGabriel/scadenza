version: 2

project_name: scadenza

builds:
  - id: scadenza
    main: ./cmd/scadenza
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/HarnageaGabriel/scadenza/internal/version.Version={{ .Version }}
      - -X github.com/HarnageaGabriel/scadenza/internal/version.Commit={{ .Commit }}
      - -X github.com/HarnageaGabriel/scadenza/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, NOTICE, README.md, CHANGELOG.md]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
    # VERIFY: confirm the configured SBOM tool is available in the release image.
    cmd: syft
    args: ["{{ .ArtifactPath }}", "-o", "spdx-json={{ .Output }}"]

signs:
  - artifacts: checksum
    cmd: cosign
    args: [sign-blob, "${artifact}", --bundle, "${signature}", --yes]
    signature: "${artifact}.bundle"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug fixes
      regexp: '^fix'
      order: 1
    - title: Other changes
      order: 999

release:
  draft: true

